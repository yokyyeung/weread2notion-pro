name: weread authentication diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Check authentication without exposing credentials
        env:
          WEREAD_COOKIE: ${{ secrets.WEREAD_COOKIE }}
        run: python scripts/diagnose_auth.py
